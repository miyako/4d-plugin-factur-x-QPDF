name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        if: github.ref_type == 'branch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require a branch selection
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != branch ]; then
            echo "::error::Select a branch, not a tag, to bump its version."
            exit 1
          fi

      - name: bump coordinated version metadata
        id: bump
        env:
          BUMP_MODE: ${{ inputs.mode }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py check-commit
          NEW=$(python3 .github/scripts/release.py bump "$BUMP_MODE")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION facturx/CMakeLists.txt facturx/Info.plist.in
          git commit -m "chore: bump version to ${NEW}"
          git -c push.followTags=false push origin "HEAD:${SELECTED_REF}"

      - name: summary
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          echo "### Committed version ${VERSION} to the selected branch. No tag or release created; run Build separately." >> "$GITHUB_STEP_SUMMARY"
